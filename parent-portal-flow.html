const { useState, useEffect } = React;
type CSSProperties = any;
type TextProps = { children?: any };

const BRAND = "#106DBA";
const THEME = {
  text: { primary: "#1b1f24", secondary: "#57606a", tertiary: "#8b949e", quaternary: "#c4c9cf", link: BRAND, onAccent: "#ffffff" },
  bg: { editor: "#ffffff", chrome: "#f3f5f7", elevated: "#ffffff" },
  fill: { primary: "rgba(20,20,20,0.20)", secondary: "rgba(20,20,20,0.10)", tertiary: "rgba(16,109,186,0.08)", quaternary: "rgba(20,20,20,0.04)" },
  stroke: { primary: "rgba(20,20,20,0.22)", secondary: "rgba(20,20,20,0.13)", tertiary: "rgba(20,20,20,0.07)", focused: BRAND },
  accent: { primary: BRAND, control: BRAND, controlHover: "#0d5a9a" },
  category: { red: "#d1242f", green: "#1a7f37", yellow: "#bf8700", blue: "#0969da", gray: "#8b949e", purple: "#8250df", cyan: "#1b7c83", pink: "#bf3989", orange: "#bc4c00" },

function useHostTheme() { return THEME; }

function Stack({ children, gap = 8, style }: any) {
  return <div style={{ display: "flex", flexDirection: "column", gap, ...style }}>{children}</div>;
}
function Row({ children, gap = 8, align = "center", justify = "start", wrap = false, style }: any) {
  const m: any = { start: "flex-start", end: "flex-end", center: "center", stretch: "stretch", "space-between": "space-between" };
  return <div style={{ display: "flex", gap, alignItems: m[align], justifyContent: m[justify], flexWrap: wrap ? "wrap" : "nowrap", ...style }}>{children}</div>;
}
function Grid({ children, columns, gap = 8, align, style }: any) {
  const cols = typeof columns === "number" ? `repeat(${columns}, minmax(0, 1fr))` : columns;
  return <div style={{ display: "grid", gridTemplateColumns: cols, gap, alignItems: align, ...style }}>{children}</div>;
}
function Spacer() { return <div style={{ flex: 1 }} />; }
function Divider({ style }: any) { return <div style={{ height: 1, background: THEME.stroke.tertiary, width: "100%", ...style }} />; }
function H1({ children, style }: any) { return <h1 style={{ fontSize: 24, lineHeight: "30px", fontWeight: 600, margin: 0, color: THEME.text.primary, ...style }}>{children}</h1>; }
function H2({ children, style }: any) { return <h2 style={{ fontSize: 18, lineHeight: "24px", fontWeight: 600, margin: 0, color: THEME.text.primary, ...style }}>{children}</h2>; }
function H3({ children, style }: any) { return <h3 style={{ fontSize: 16, lineHeight: "22px", fontWeight: 600, margin: 0, color: THEME.text.primary, ...style }}>{children}</h3>; }
function Text({ children, tone = "primary", size = "body", weight = "normal", style }: any) {
  const w: any = { normal: 400, medium: 500, semibold: 600, bold: 700 };
  return <div style={{ margin: 0, fontSize: size === "small" ? 12 : 14, lineHeight: size === "small" ? "16px" : "20px", fontWeight: w[weight], color: (THEME.text as any)[tone], ...style }}>{children}</div>;
}
function Button({ children, variant = "secondary", disabled, onClick, style }: any) {
  const base: any = { height: 28, padding: "0 12px", borderRadius: 6, fontSize: 12.5, fontWeight: 500, cursor: disabled ? "default" : "pointer", whiteSpace: "nowrap", border: "1px solid transparent", opacity: disabled ? 0.5 : 1 };
  const v: any = {

    secondary: { background: THEME.bg.editor, color: THEME.text.primary, borderColor: THEME.stroke.primary },

  return <button disabled={disabled} onClick={onClick} style={{ ...base, ...v[variant], ...style }}>{children}</button>;
}
function Pill({ children, active, size = "md", onClick, style }: any) {

}
function Table({ headers, rows, rowTone, style }: any) {

function Select({ value, onChange, options, style }: any) {

function Toggle({ checked, onChange }: any) {

    .map((p) => p[0])
    .slice(0, 2)
    .join("");
  return (
    <div
      style={{
        width: size,
        height: size,
        borderRadius: square ? 8 : size / 2,
        background: t.fill.secondary,
        color: t.text.secondary,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        fontSize: Math.round(size * 0.36),
        fontWeight: 600,
        flexShrink: 0,

    </div>

}

function QrCode({ token, size = 120 }: { token: string; size?: number }) {
  const t = useHostTheme();
  const n = 21;
  let h = 7;
  for (const ch of token) h = (Math.imul(h, 31) + ch.charCodeAt(0)) >>> 0;
  if (h === 0) h = 1;
  const rand = () => {
    h ^= h << 13;
    h >>>= 0;
    h ^= h >>> 17;
    h ^= h << 5;
    h >>>= 0;
    return h / 4294967296;
  };
  const finder = (r: number, c: number): boolean | undefined => {
    for (const [or, oc] of [
      [0, 0],
      [0, n - 7],
      [n - 7, 0],
    ]) {
      if (!(r >= or - 1 && r <= or + 7 && c >= oc - 1 && c <= oc + 7)) continue;
      const rr = r - or;
      const cc = c - oc;
      if (rr < 0 || rr > 6 || cc < 0 || cc > 6) return false;
      return rr === 0 || rr === 6 || cc === 0 || cc === 6 || (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4);
    }
    return undefined;
  };
  const cells: Array<[number, number]> = [];
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      const f = finder(r, c);
      if (f === undefined ? rand() > 0.52 : f) cells.push([r, c]);
    }
  }
  return (
    <svg width={size} height={size} viewBox={`-1 -1 ${n + 2} ${n + 2}`} style={{ display: "block" }}>
      <rect x={-1} y={-1} width={n + 2} height={n + 2} fill={t.bg.editor} />
      {cells.map(([r, c]) => (
        <rect key={`${r}-${c}`} x={c} y={r} width={1.02} height={1.02} fill={t.text.primary} />
      ))}
    </svg>
  );
}

const BASE = "guestrar.com/p/sunrise";

/* ===================== Flow chart ===================== */

type Side = "t" | "b" | "l" | "r";
type FNode = { id: string; col: number; row: number; text: string; kind?: "decision" | "alt" | "start" };
type FEdge = { from: string; to: string; fs: Side; ts: Side; label?: string; alt?: boolean };

const FN: FNode[] = [
  { id: "link", col: 1, row: 0, text: "Taps link in class WhatsApp group", kind: "start" },
  { id: "mob", col: 1, row: 1, text: "P1 Enter mobile number" },
  { id: "d1", col: 1, row: 2, text: "Number in school records?", kind: "decision" },
  { id: "nr", col: 0, row: 2, text: "P2 Not registered: contact school office", kind: "alt" },
  { id: "otp", col: 1, row: 3, text: "P3 Enter OTP" },
  { id: "d2", col: 1, row: 4, text: "OTP correct?", kind: "decision" },
  { id: "err", col: 0, row: 4, text: "P3a Wrong OTP: retry, or locked 15 min after 5 tries", kind: "alt" },
  { id: "d3", col: 1, row: 5, text: "Profile already created?", kind: "decision" },
  { id: "prof", col: 2, row: 5, text: "P4 Create profile (name, relation, photo)" },
  { id: "first", col: 2, row: 6, text: "P4b Add pickup persons now (or skip)" },
  { id: "home", col: 1, row: 7, text: "P5 Home: children, who can pick up, recent pickups" },
  { id: "qr", col: 0, row: 8, text: "P7 Passes: one QR per person per child" },
  { id: "add", col: 1, row: 8, text: "P6 Add / edit / remove person" },
  { id: "hist", col: 2, row: 8, text: "P8 Pickup history" },
  { id: "me", col: 3, row: 8, text: "P9 My profile, log out" },
];

const FE: FEdge[] = [
  { from: "link", to: "mob", fs: "b", ts: "t" },
  { from: "mob", to: "d1", fs: "b", ts: "t" },
  { from: "d1", to: "nr", fs: "l", ts: "r", label: "No", alt: true },
  { from: "d1", to: "otp", fs: "b", ts: "t", label: "Yes" },
  { from: "otp", to: "d2", fs: "b", ts: "t" },
  { from: "d2", to: "err", fs: "l", ts: "r", label: "No", alt: true },
  { from: "err", to: "otp", fs: "t", ts: "l", alt: true },
  { from: "d2", to: "d3", fs: "b", ts: "t", label: "Yes" },
  { from: "d3", to: "prof", fs: "r", ts: "l", label: "No" },
  { from: "prof", to: "first", fs: "b", ts: "t" },
  { from: "first", to: "home", fs: "b", ts: "r" },
  { from: "d3", to: "home", fs: "b", ts: "t", label: "Yes" },
  { from: "home", to: "qr", fs: "b", ts: "t" },
  { from: "home", to: "add", fs: "b", ts: "t" },
  { from: "home", to: "hist", fs: "b", ts: "t" },
  { from: "home", to: "me", fs: "b", ts: "t" },
];

const COLW = 200;
const ROWH = 78;
const NW = 168;
const NH = 50;
const PAD = 16;

function anchor(n: FNode, s: Side): [number, number] {
  const x = PAD + n.col * COLW + (COLW - NW) / 2;
  const y = PAD + n.row * ROWH;
  if (s === "t") return [x + NW / 2, y];
  if (s === "b") return [x + NW / 2, y + NH];
  if (s === "l") return [x, y + NH / 2];
  return [x + NW, y + NH / 2];
}

function normal(s: Side): [number, number] {
  if (s === "t") return [0, -1];
  if (s === "b") return [0, 1];
  if (s === "l") return [-1, 0];
  return [1, 0];
}

function FlowChart() {
  const t = useHostTheme();
  const byId = new Map(FN.map((n) => [n.id, n]));
  const width = PAD * 2 + 4 * COLW;
  const height = PAD * 2 + 8 * ROWH + NH;

  return (
    <div style={{ overflowX: "auto", border: `1px solid ${t.stroke.secondary}`, borderRadius: 10 }}>
      <div style={{ position: "relative", width, height }}>
        <svg width={width} height={height} style={{ position: "absolute", left: 0, top: 0 }}>
          <defs>
            <marker id="pp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
              <path d="M0,0 L8,4 L0,8 z" fill={t.text.tertiary} />
            </marker>
          </defs>
          {FE.map((e) => {
            const a = byId.get(e.from);
            const b = byId.get(e.to);
            if (!a || !b) return null;
            const [sx, sy] = anchor(a, e.fs);
            const [tx0, ty0] = anchor(b, e.ts);
            const [nx, ny] = normal(e.fs);
            const [mx, my] = normal(e.ts);
            const tx = tx0 + mx * 2;
            const ty = ty0 + my * 2;
            const k = 28;
            const d = `M ${sx} ${sy} C ${sx + nx * k} ${sy + ny * k}, ${tx + mx * k} ${ty + my * k}, ${tx} ${ty}`;
            const lx = (sx + tx) / 2;
            const ly = (sy + ty) / 2;
            return (
              <g key={`${e.from}-${e.to}`}>
                <path d={d} fill="none" stroke={t.text.tertiary} strokeWidth={1.3} strokeDasharray={e.alt ? "4 3" : undefined} markerEnd="url(#pp-arrow)" />
                {e.label ? (
                  <text x={lx + (e.fs === "b" ? 8 : 0)} y={ly - (e.fs === "b" ? 0 : 5)} fontSize={10} fill={t.text.secondary} textAnchor={e.fs === "b" ? "start" : "middle"}>
                    {e.label}
                  </text>
                ) : null}
              </g>
            );
          })}
        </svg>
        {FN.map((n) => {
          const x = PAD + n.col * COLW + (COLW - NW) / 2;
          const y = PAD + n.row * ROWH;
          const isDec = n.kind === "decision";
          const isAlt = n.kind === "alt";
          const isStart = n.kind === "start";
          return (
            <div
              key={n.id}
              style={{
                position: "absolute",
                left: x,
                top: y,
                width: NW,
                height: NH,
                boxSizing: "border-box",
                borderRadius: isDec ? 25 : 6,
                border: `1px ${isAlt ? "dashed" : "solid"} ${isStart ? t.accent.primary : isAlt ? t.stroke.primary : t.stroke.secondary}`,
                background: isDec ? t.fill.tertiary : t.bg.editor,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                textAlign: "center",
                padding: "4px 10px",
                fontSize: 11,
                lineHeight: "14px",
                fontWeight: isDec ? 600 : 400,
                color: isAlt ? t.text.secondary : t.text.primary,
              }}
            >
              {n.text}
            </div>
          );
        })}
      </div>
    </div>
  );
}

            {
              d: "Yesterday",

                { k: "Aarav", who: "Ramesh Patil (Driver)", time: "2:46 PM", ok: true },

function Returning() {
  const t = useHostTheme();
  const steps = ["Open the same link", "P1 Enter mobile", "P3 OTP", "P5 Home (no profile step)", "Edit, add, remove or view QR"];
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
      {steps.map((s, i) => (
        <div key={s} style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <div style={{ border: `1px solid ${t.stroke.secondary}`, borderRadius: 8, padding: "7px 11px", fontSize: 12, color: t.text.primary, background: i === 3 ? t.fill.tertiary : "transparent" }}>{s}</div>
          {i < steps.length - 1 ? <span style={{ color: t.text.tertiary }}>→</span> : null}
        </div>
      ))}
    </div>
  );
}
